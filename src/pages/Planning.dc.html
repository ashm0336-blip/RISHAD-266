#bsPtRoot .pt-tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;border-radius:12px;transition:color .3s,background-color .3s,box-shadow .3s,border-color .3s;flex-shrink:0;min-width:170px;cursor:pointer;font-family:'Cairo',sans-serif;border:1px solid transparent;background:transparent}
#bsPtRoot .pt-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background-color .3s,color .3s;background:var(--tone-neutral-100-a90);color:var(--text-faint)}
#bsPtRoot .pt-lbl{font-size:12px;transition:color .3s;font-weight:400;color:var(--text-secondary)}
#bsPtRoot .pt-ul{display:none;position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:32px;height:2px;border-radius:9999px;background:var(--border-brand)}
#bsPtRoot[data-pton=""] .pt-strip{display:none}
#bsPtRoot[data-ptab="sched"] .pt-tab.pt-sched{border-color:var(--tone-gold-50-a45);background:var(--bg-surface);box-shadow:0 3px 10px -4px rgba(138,111,53,0.45)}
#bsPtRoot[data-ptab="sched"] .pt-sched .pt-ico{background:var(--tone-gold-50-a10);color:var(--brand-fg)}
#bsPtRoot[data-ptab="sched"] .pt-sched .pt-lbl{font-weight:600;color:var(--brand-fg)}
#bsPtRoot[data-ptab="sched"] .pt-sched .pt-ul{display:block}
#bsPtRoot:not([data-ptab="sched"]) #bsPtSched{display:none}
#bsPtRoot[data-pton="sched"] .pt-strip{display:none}
#bsPtRoot:not([data-pton~="sched"]) .pt-sched{display:none}
#bsPtRoot[data-ptab="plan"] .pt-tab.pt-plan{border-color:var(--tone-gold-50-a45);background:var(--bg-surface);box-shadow:0 3px 10px -4px rgba(138,111,53,0.45)}
#bsPtRoot[data-ptab="plan"] .pt-plan .pt-ico{background:var(--tone-gold-50-a10);color:var(--brand-fg)}
#bsPtRoot[data-ptab="plan"] .pt-plan .pt-lbl{font-weight:600;color:var(--brand-fg)}
#bsPtRoot[data-ptab="plan"] .pt-plan .pt-ul{display:block}
#bsPtRoot:not([data-ptab="plan"]) #bsPtPlan{display:none}
#bsPtRoot[data-pton="plan"] .pt-strip{display:none}
#bsPtRoot:not([data-pton~="plan"]) .pt-plan{display:none}
</style></helmet>

</div>
