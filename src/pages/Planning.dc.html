<helmet><style>body{margin:0;background:var(--bg-app);font-family:'Cairo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:var(--text-primary)}</style><style>
#bsPtRoot .pt-tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;border-radius:12px;transition:color .3s,background-color .3s,box-shadow .3s,border-color .3s;flex-shrink:0;min-width:170px;cursor:pointer;font-family:'Cairo',sans-serif;border:1px solid transparent;background:transparent}
#bsPtRoot .pt-ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background-color .3s,color .3s;background:var(--tone-neutral-100-a90);color:var(--text-faint)}
#bsPtRoot .pt-lbl{font-size:12px;transition:color .3s;font-weight:400;color:var(--text-secondary)}
#bsPtRoot .pt-ul{display:none;position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:32px;height:2px;border-radius:9999px;background:var(--border-brand)}
#bsPtRoot[data-ptab="sched"] .pt-tab.pt-sched,#bsPtRoot[data-ptab="plan"] .pt-tab.pt-plan{border-color:var(--tone-gold-50-a45);background:var(--bg-surface);box-shadow:0 3px 10px -4px rgba(138,111,53,0.45)}
#bsPtRoot[data-ptab="sched"] .pt-sched .pt-ico,#bsPtRoot[data-ptab="plan"] .pt-plan .pt-ico{background:var(--tone-gold-50-a10);color:var(--brand-fg)}
#bsPtRoot[data-ptab="sched"] .pt-sched .pt-lbl,#bsPtRoot[data-ptab="plan"] .pt-plan .pt-lbl{font-weight:600;color:var(--brand-fg)}
#bsPtRoot[data-ptab="sched"] .pt-sched .pt-ul,#bsPtRoot[data-ptab="plan"] .pt-plan .pt-ul{display:block}
#bsPtRoot[data-ptab="plan"] #bsPtSched,#bsPtRoot[data-ptab="sched"] #bsPtPlan{display:none}
#bsPtRoot[data-pton="sched"] .pt-strip,#bsPtRoot[data-pton="plan"] .pt-strip,#bsPtRoot[data-pton=""] .pt-strip{display:none}
#bsPtRoot:not([data-pton~="sched"]) .pt-sched,#bsPtRoot:not([data-pton~="plan"]) .pt-plan,#bsPtRoot[data-ptab="none"] #bsPtSched,#bsPtRoot[data-ptab="none"] #bsPtPlan{display:none}
</style></helmet>

        <sc-if value="{{onRead}}" hint-placeholder-val="{{ true }}"><span style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:32px;height:2px;border-radius:9999px;background:var(--bg-xb99751)"></span></sc-if>
      </div>
      </sc-if>
      <div onClick="{{goSched}}" class="pt-tab pt-sched">
        <div class="pt-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect></svg></div>

        <span class="pt-ul"></span>
      </div>
      <div onClick="{{goPlan}}" class="pt-tab pt-plan">
        <div class="pt-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20 3 17V4l6 3 6-3 6 3v13l-6-3-6 3Z"></path><path d="M9 7v13M15 4v13"></path></svg></div>
        <span class="pt-lbl">التشغيل الميداني</span>
        <span class="pt-ul"></span>
      </div>
    </div>
  </div>
  <sc-if value="{{onRead}}" hint-placeholder-val="{{ false }}"><dc-import name="Employees" solo="readiness" hint-size="100%,1100px"></dc-import></sc-if>
  <sc-if value="{{schedOn}}" hint-placeholder-val="{{ true }}"><div id="bsPtSched"><dc-import name="Staffing" hint-size="100%,1100px"></dc-import></div></sc-if>
  <sc-if value="{{planSeen}}" hint-placeholder-val="{{ false }}"><div id="bsPtPlan"><dc-import name="Operational Plan" hint-size="100%,1100px"></dc-import></div></sc-if>
</div>
</x-dc>
